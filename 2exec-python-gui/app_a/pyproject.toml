[project]
name = "app-a"
version = "0.1.0"
description = "GUI app A (PySide6). Never imports subsystem B; talks to B_worker via NDJSON IPC."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_a"]
